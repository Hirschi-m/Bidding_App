services:
  - type: web
    name: pizza-bid-app
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn pizza_bid.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pizza-bid-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
databases:
  - name: pizza-bid-db
